ffmpeg_manager:
  width: 1920
  height: 1080
  fps: 30
  codec: h264
  quality: medium
  bitrate_kbps:
  verbose: false

video_compressor:
  inputs: []
  output_dir:
  suffix: _compressed
  codec: h264
  quality: medium
  max_height: 1080
  audio_kbps: 128
  preset: medium
  two_pass: false
  hw: auto
  overwrite: false
  show_progress: true
  fail_fast: false
  ffmpeg_binary: ffmpeg
  ffprobe_binary: ffprobe
  verbose: false

youtube_download:
  inputs: []
  output:
  format_selector: bestvideo+bestaudio/best
  merge_format: mp4
  archive:
  no_playlist: false
  fail_fast: false
  quiet: false
  show_progress: true
  verbose: false

image_video_converter:
  mode: video-to-images
  inputs: []
  output:
  fps: 1
  interval_seconds:
  image_extension: jpg
  image_quality: 95
  codec:
  resize_frames: false
  overwrite: false
  show_progress: true
  fail_fast: false
  verbose: false

dedupe_by_similarity:
  inputs: []
  output_dir:
  suffix: _deduped
  threshold: 0.95
  pixel_tolerance: 8
  resize_width: 320
  blur_kernel_size: 3
  minimum_keep_frames: 0
  quality: medium
  preset: medium
  max_height: 1080
  overwrite: false
  move_to_trash: false
  trash_dir:
  show_progress: true
  fail_fast: false
  ffmpeg_binary: ffmpeg
  ffprobe_binary: ffprobe
  verbose: false
